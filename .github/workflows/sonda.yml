name: Sonda TSE
on:
  push:
    branches: [main]
    paths: ['sonda/pedido.txt']
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testar
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36"
          out=sonda/resultado.txt; : > $out
          mkdir -p /tmp/z && cd /tmp/z
          for f in consulta_cand/consulta_cand_2026 bem_candidato/bem_candidato_2026 historico_candidatura/historico_candidatura_2026 consulta_cand_complementar/consulta_cand_complementar_2026; do
            curl -s -A "$UA" -m 300 -o a.zip "https://cdn.tse.jus.br/estatistica/sead/odsele/$f.zip"; echo "== $f" >> $GITHUB_WORKSPACE/$out
            unzip -l a.zip | head -8 >> $GITHUB_WORKSPACE/$out
            n=$(unzip -Z1 a.zip | grep -i -E "_SP\.csv$|_BRASIL\.csv$" | head -1); [ -z "$n" ] && n=$(unzip -Z1 a.zip | grep -i csv | head -1)
            echo "-- $n" >> $GITHUB_WORKSPACE/$out
            unzip -p a.zip "$n" | iconv -f latin1 -t utf-8 | head -3 >> $GITHUB_WORKSPACE/$out
            rm a.zip
          done
          curl -s -A "$UA" -m 600 -o c.zip "https://cdn.tse.jus.br/estatistica/sead/odsele/prestacao_contas/prestacao_de_contas_eleitorais_candidatos_2026.zip"
          echo "== contas" >> $GITHUB_WORKSPACE/$out; unzip -l c.zip | head -40 >> $GITHUB_WORKSPACE/$out
          for n in $(unzip -Z1 c.zip | grep -i "_SP.csv" ); do echo "-- $n" >> $GITHUB_WORKSPACE/$out; unzip -p c.zip "$n" | iconv -f latin1 -t utf-8 | head -2 >> $GITHUB_WORKSPACE/$out; done
          cd $GITHUB_WORKSPACE
      - name: Salvar
        run: |
          git config user.name "Resenha Rentável"
          git config user.email "pietro468@users.noreply.github.com"
          git add sonda/resultado.txt
          git commit -m "Sonda TSE" && git pull --rebase -q && git push
