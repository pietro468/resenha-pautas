name: Despertador longo (chama o site a cada 5 minutos por várias horas)
# O agendamento do GitHub (despertador.yml) às vezes atrasa horas. Este fica ligado e chama o site sozinho.
on:
  workflow_dispatch:
    inputs:
      minutos:
        description: "Por quantos minutos ficar chamando (máximo 350)"
        default: "350"
  schedule:
    - cron: "50 7 4,25 10 *"
    - cron: "40 13 4,25 10 *"
    - cron: "30 19 4,25 10 *"
jobs:
  vigia:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - name: Chamar o site a cada 5 minutos
        run: |
          M="${{ github.event.inputs.minutos }}"; [ -z "$M" ] && M=350
          fim=$(( $(date +%s) + M*60 ))
          while [ $(date +%s) -lt $fim ]; do
            code=$(curl -s -o r.txt -w "%{http_code}" -m 240 "https://resenharentavel.com/?rest_route=/rri/v1/buscar&n=$(date +%s)") || code=000
            echo "$(TZ=America/Sao_Paulo date +%H:%M) HTTP $code $(head -c 120 r.txt 2>/dev/null)"
            sleep 300
          done
