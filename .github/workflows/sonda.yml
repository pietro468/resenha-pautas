name: Sonda TSE
on:
  push:
    branches: [main]
    paths: ['sonda/pedido.txt']
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testar
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36"
          out=sonda/resultado.txt; : > $out
          for u in \
            https://cdn.tse.jus.br/estatistica/sead/odsele/consulta_cand/consulta_cand_2026.zip \
            https://cdn.tse.jus.br/estatistica/sead/odsele/bem_candidato/bem_candidato_2026.zip \
            https://cdn.tse.jus.br/estatistica/sead/odsele/prestacao_contas/prestacao_de_contas_eleitorais_candidatos_2026.zip ; do
            echo "== $u" >> $out; curl -sI -A "$UA" -m 60 "$u" | head -12 >> $out
          done
          echo "== ckan cand" >> $out
          curl -s -A "$UA" -m 60 "https://dadosabertos.tse.jus.br/api/3/action/package_show?id=candidatos-2026" | python3 -c "import json,sys;d=json.load(sys.stdin);[print(r.get('name'),r.get('url'),r.get('last_modified')) for r in d['result']['resources']]" >> $out 2>&1
          echo "== ckan contas" >> $out
          curl -s -A "$UA" -m 60 "https://dadosabertos.tse.jus.br/api/3/action/package_search?q=presta%C3%A7%C3%A3o%20de%20contas%202026&rows=5" | python3 -c "import json,sys;d=json.load(sys.stdin);[print(p['name'],[r.get('url') for r in p['resources']][:6]) for p in d['result']['results']]" >> $out 2>&1
          echo "== divulga (UA navegador)" >> $out
          curl -s -A "$UA" -H "Accept: application/json" -H "Referer: https://divulgacandcontas.tse.jus.br/divulga/" -m 60 -o /tmp/d.json -w "%{http_code}\n" "https://divulgacandcontas.tse.jus.br/divulga/rest/v1/candidatura/listar/2026/BR/20322002026/1/candidatos" >> $out
          head -c 300 /tmp/d.json >> $out; echo >> $out
          echo "== ip" >> $out; curl -s -m 20 https://ipinfo.io/country >> $out
      - name: Salvar
        run: |
          git config user.name "Resenha Rentável"
          git config user.email "pietro468@users.noreply.github.com"
          git add sonda/resultado.txt
          git commit -m "Sonda TSE" && git pull --rebase -q && git push
