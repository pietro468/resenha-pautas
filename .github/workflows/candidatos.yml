name: Candidatos 2026 (dados do TSE)
on:
  schedule:
    - cron: '14 9 * * *'   # todo dia às 6h14 (Brasília)
  push:
    branches: [main]
    paths: ['candidatos/pedido.txt', 'ferramentas/candidatos.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency: candidatos
jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Gerar
        run: python3 ferramentas/candidatos.py candidatos/2026
      - name: Salvar
        run: |
          git config user.name "Resenha Rentável"
          git config user.email "pietro468@users.noreply.github.com"
          git add candidatos/2026
          git diff --cached --quiet || (git commit -m "Candidatos 2026: dados do TSE" && git pull --rebase -q && git push)
